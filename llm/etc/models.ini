; streams), n-gram per-layer embeddings. Needs build v050/b10729 (both know qwen4exp, lazy-mode and n-cpu-moe).
; File = the two ISTA shards merged with llama-gguf-split (models/qwen3.8-flash-next-coder/ keeps the originals and
; the mmproj): the link farm and slerm_topo take one file per model.
; 27.6 GiB transformer + 28.8 GiB per_layer_token_embd (the n-gram table). lazy-mode on reads rows of the table from
; the file on demand (mmapped even under load-mode dio, see init_mappings in llama-model-loader.cpp), so it is never
; resident and only the transformer is placed. Do NOT set load-mode mmap as the model card does: the CPU-held experts
; would become evictable page cache again (see [*]).
; Fit at 128k, estimated from the tensor sizes and calibrated on the 15.2/14.6 GiB measured for Q5: 27.25 GiB on the
; cards + 0.85 mmproj + 3.0 f16 KV (12 attention layers x 2 kv heads x 256) + 0.4 indexer cache + ~1.9/card buffers
; (QSA adds ~0.8: its score/expand/mask temporaries are n_kv x ubatch f32) = ~6.7 GiB too much. n-cpu-moe 15 keeps the
; EXPERT tensors of layers 0-14 (6.7 GiB) in node04 RAM; attention, KV and everything else stay on the cards, so unlike
; the n-gpu-layers spill models it should not slow down as the context fills (the CPU reads ~0.26 GiB of experts per
; token, and prompt batches copy those 6.7 GiB over PCIe per ubatch). 60,40 gives GPU0 layers 0-29 (light ones, their
; experts are on the CPU) plus the vision encoder: estimate 14.75 / 14.70 GiB. If it OOMs at load, raise n-cpu-moe; if
; it has room, lower it (each layer is ~0.47 GiB of experts).
; Auto-fit would size this exactly, but slerm_topo always writes a tensor-split, which disables it.
[qwen3.8-flash-next-coder]
; 2026-10-17 (user: "boost this performance"): CPU experts chosen per layer instead of n-cpu-moe 15 (layers 0-14).
; Measured live: GPU0 idle ~75% of its timeline, waiting ~10 ms at a time for the CPU expert layers. Layers
; 1/8/10/12/13 keep ffn_down_exps in Q2_0, which has NO x86 kernel in this build (generic scalar fallback, ~9x the
; cost of IQ4_NL per layer), and IQ2_S/IQ3_XXS are the slowest CPU kernels. These 11 layers (6.15 GiB) are the
; cheapest CPU time per GiB moved off the cards (IQ3_S/IQ4 + IQ4_NL down, no Q2_0): estimated ~45% less CPU work
; per token and 11 instead of 15 CPU round trips. Split 41,59 = GPU0 layers 0-20, GPU1 21-47 + output; estimated
; 14.37 / 14.63 GiB at 128k (calibrated on the measured 14790 / 14298 MiB of the n-cpu-moe 15 load).
; Rollback: models.ini.bak-cpulayers-20261017.
tensor-split = 0,0,0,41,59
override-tensor = blk.(2|17|25|27|28|29|35|40|44|45|47).ffn_(gate|up|down)_exps=CPU
ctx-size = 131072
lazy-mode = on
; f16 KV beats q8_0 on Pascal as the context grows (Ornith bench 2026-10-06) and is the precise format.
cache-type-k = f16
cache-type-v = f16
; vision encoder (ISTA BF16 mmproj, qwen3vl_merger, 768 px tiles). 2304 image tokens = a 1920x1080 screenshot at full
; resolution; bigger images are scaled down. The cap also bounds the encoder buffer reserved on GPU0.
mmproj = /data/llm/models/qwen3.8-flash-next-coder/mmproj-qwen3.8-flash-next-bf16.gguf
image-max-tokens = 2304
; hybrid model: each checkpoint holds the recurrent state, so keep a few (qwen3.8-27b lesson, 2026-10-08).
ctx-checkpoints = 8
; The chat template inside the GGUF is byte-identical to etc/qwen3.8-unsloth.jinja (maps "high" to xhigh, developer
; role), so no chat-template-file. Same thinking settings as qwen3.8-27b (the user chose those): cap a runaway step at
; 16k, default effort medium when a request sends none.
reasoning-budget = 16384
reasoning-effort = medium
reasoning-budget-message = Okay, I have thought about this enough. Now I will act on the best plan so far.
; GGUF general.sampling + the Qwen3.8 card (thinking mode). Clients that send their own values win.
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0
