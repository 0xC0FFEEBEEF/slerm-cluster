; Per-model router settings. Keys are llama-server arguments without the dashes.
; Precedence: CLI > this section > [*]. The router therefore passes NO
; --ctx-size / --tensor-split of its own, or these would all be overridden.
;
; 2026-10-04: rewritten for two Tesla P100s (16 GB each), both in slerm-node04.
; Pre-P100 file: models.ini.bak-p100-20261004 (1660 SUPER + 980 Ti, ~10.4 GB pooled).
;
; Device order is the --rpc list, then the router's local GPUs:
;   [node01 CPU] [node02 CPU] [node05 CPU] [node04 GPU0] [node04 GPU1]
; Every split has FIVE values (slerm_topo.py derives the shorter ones for smaller
; device sets). A share of 0 EXCLUDES that device.
;   0,0,0,1,0  GPU0 only -- the x16 card. Anything that fits one card goes here: no
;              hop between the cards, and the other card stays cool.
;   0,0,0,1,1  both cards, layer split (pipelined: capacity, not speed).
; GP100 has no dp4a, so quantized generation runs at ~1/4 of its bandwidth; it is
; still 2-3.5x the old pool (llama-bench 2026-10-04, one card: gpt-oss-20b 61.6,
; qwen3-30b-a3b Q3 52.0, qwen3-14b 21.7, qwen3-8b 38.1 tok/s). The old 980 Ti
; crash at ~30.2k context is gone: gpt-oss-20b ran 60k prompts on one P100.
version = 1

[*]
; Prompt cache in host RAM (saved conversation states, restored when a conversation comes back to the one slot).
; 2026-10-04: 1024 -> 6144. opencode sub-agents run separate conversations on the same model; a 39k-token
; kat-coder state is 626 MiB, so 1 GiB held one and every switch re-processed ~38k tokens (~100 s per step,
; "f_sim_best = 0.189", cache 0). node04 has 15.6 GB; the router job is --mem=10G with load-mode none.
; (2026-10-10: node04 has 45 GB and the router job is --mem=41G.)
cache-ram = 6144
; 2026-10-04: no mmap. The router's model-cache keeper copies GGUFs inside the same 10G job cgroup, and its page
; cache evicted the mmapped CPU-side tensors (token_embd) of the model being served: qwen3.6-35b Q4 fell from 44 to
; 12-14 tok/s with both GPUs mostly idle. With "none" those tensors live in anonymous memory and cannot be evicted.
; 2026-10-10: none -> dio (direct I/O). Same anonymous, non-evictable tensors as "none", but the file is read without
; the page cache. node04 now has two NUMA halves and the router prefers the two-channel one (node 1); with "none" the
; cache of whatever GGUF was read last filled node 1 and the next model's CPU-held layers landed on the slow half.
; Back to "none" if a load misbehaves -- that only costs placement, not correctness.
load-mode = dio
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
reasoning-format = deepseek
ctx-size = 8192

